name: vps-watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vps-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run watcher
        env:
          TZ: Asia/Shanghai
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python3 watch.py --once
      - name: Commit state
        run: |
          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "no state change"
            exit 0
          fi
          git config user.name "vps-watch"
          git config user.email "vps-watch@users.noreply.github.com"
          git add state.json
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
